<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>残業報告</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-md glass-panel rounded-3xl p-6 shadow-2xl text-white">
        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-12 space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-400"></div>
            <p class="text-cyan-300 font-light text-sm tracking-wide">LINE認証をロード中...</p>
        </div>

        <!-- Main Form (Hidden by default) -->
        <div id="form-container" class="hidden space-y-6">
            <div class="text-center space-y-1">
                <div class="inline-flex p-3 rounded-2xl bg-cyan-500/10 text-cyan-400 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 to-fuchsia-300">
                    残業時間報告
                </h1>
                <p id="user-greeting" class="text-gray-400 text-sm font-light">お疲れ様でした！</p>
            </div>

            <form id="overtime-form" class="space-y-5">
                <!-- Start Time -->
                <div class="space-y-2">
                    <label for="start-time" class="block text-xs font-semibold uppercase tracking-wider text-cyan-400">残業開始時刻</label>
                    <input type="time" id="start-time" name="startTime" required
                        class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition text-lg">
                </div>

                <!-- End Time -->
                <div class="space-y-2">
                    <label for="end-time" class="block text-xs font-semibold uppercase tracking-wider text-fuchsia-400">残業終了時刻</label>
                    <input type="time" id="end-time" name="endTime" required
                        class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:ring-2 focus:ring-fuchsia-400 focus:border-transparent transition text-lg">
                </div>

                <!-- Error Message -->
                <div id="error-msg" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm text-center"></div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full py-4 rounded-xl font-semibold tracking-wide text-black bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-400 hover:opacity-90 active:scale-[0.98] transition shadow-lg shadow-cyan-500/20 text-lg">
                    報告を送信する
                </button>
            </form>
        </div>

        <!-- Success Screen (Hidden by default) -->
        <div id="success-container" class="hidden text-center py-10 space-y-4">
            <div class="inline-flex p-4 rounded-full bg-emerald-500/10 text-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-xl font-bold text-white">送信完了しました</h2>
            <p class="text-gray-400 text-sm font-light">残業報告をスプレッドシートに記録しました。<br>画面を閉じます...</p>
        </div>
    </div>

    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        const LIFF_ID = '__LIFF_ID__'; // Server will inject this
        let userId = '';
        let userName = 'メンバー';

        const loadingDiv = document.getElementById('loading');
        const formContainer = document.getElementById('form-container');
        const successContainer = document.getElementById('success-container');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        // Set default times (start to now, end to now)
        const now = new Date();
        const formatTime = (date) => {
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        };
        
        // Default start time to 18:00 (usual overtime start)
        document.getElementById('start-time').value = "18:00";
        document.getElementById('end-time').value = formatTime(now);

        // Initialize LIFF
        liff.init({ liffId: LIFF_ID })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                // Get profile / ID token data
                const context = liff.getContext();
                if (context && context.userId) {
                    userId = context.userId;
                }

                return liff.getProfile();
            })
            .then((profile) => {
                if (profile) {
                    userName = profile.displayName;
                    if (!userId) userId = profile.userId;
                }
                document.getElementById('user-greeting').innerText = `${userName} さん、お疲れ様でした！`;
                
                // Show Form
                loadingDiv.classList.add('hidden');
                formContainer.classList.remove('hidden');
            })
            .catch((err) => {
                console.error('LIFF Initialization failed', err);
                loadingDiv.innerHTML = `
                    <div class="text-rose-400 font-semibold mb-2">初期化エラー</div>
                    <p class="text-gray-400 text-xs">${err.message || err}</p>
                `;
            });

        // Handle Form Submission
        document.getElementById('overtime-form').addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;

            if (!startTime || !endTime) {
                showError('開始時刻と終了時刻を選択してください。');
                return;
            }

            // Simple validation: start should be before end (or handle cross-midnight)
            // (Just a warning/notice is fine since shifts can cross midnight, but let's trust the user)

            submitBtn.disabled = true;
            submitBtn.innerText = '送信中...';
            submitBtn.classList.add('opacity-50');

            fetch('/api/overtime', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    userId,
                    userName,
                    startTime,
                    endTime
                })
            })
            .then(res => {
                if (!res.ok) throw new Error('API送信エラーが発生しました。');
                return res.json();
            })
            .then(data => {
                // Show Success Screen
                formContainer.classList.add('hidden');
                successContainer.classList.remove('hidden');
                
                // Close LIFF Window after 1.5 seconds
                setTimeout(() => {
                    liff.closeWindow();
                }, 1500);
            })
            .catch(err => {
                console.error(err);
                showError(err.message || '送信に失敗しました。時間をおいて再度お試しください。');
                submitBtn.disabled = false;
                submitBtn.innerText = '報告を送信する';
                submitBtn.classList.remove('opacity-50');
            });
        });

        function showError(message) {
            errorMsg.innerText = message;
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
