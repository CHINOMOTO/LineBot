<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>残業報告</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc; /* bg-slate-50 */
        }
        input[type="time"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800">
    <!-- Main Container (Full screen mobile style) -->
    <div id="app" class="flex flex-col flex-1 w-full max-w-md mx-auto bg-white min-h-screen shadow-sm">
        
        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center flex-1 py-12 space-y-4">
            <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-slate-600"></div>
            <p class="text-slate-500 text-sm font-light">読み込み中...</p>
        </div>

        <!-- Main Form (Hidden by default) -->
        <div id="form-container" class="hidden flex-1 flex flex-col p-6 justify-between">
            <div class="space-y-6">
                <!-- Header -->
                <div class="border-b border-slate-100 pb-4">
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">残業時間報告</h1>
                    <p id="user-greeting" class="text-slate-500 text-xs mt-1">お疲れ様でした！</p>
                </div>

                <form id="overtime-form" class="space-y-5">
                    <!-- Start Time -->
                    <div class="space-y-1.5">
                        <label for="start-time" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">残業開始時刻</label>
                        <input type="time" id="start-time" name="startTime" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:bg-white transition text-lg box-border">
                    </div>

                    <!-- End Time -->
                    <div class="space-y-1.5">
                        <label for="end-time" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">残業終了時刻</label>
                        <input type="time" id="end-time" name="endTime" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:bg-white transition text-lg box-border">
                    </div>

                    <!-- Error Message -->
                    <div id="error-msg" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-100 text-rose-600 text-sm text-center"></div>
                </form>
            </div>

            <!-- Submit Button (Sticky to bottom style) -->
            <div class="mt-8 pt-4 border-t border-slate-100">
                <button type="submit" form="overtime-form" id="submit-btn"
                    class="w-full py-4 rounded-xl font-bold text-white bg-[#06C755] active:bg-[#05b04b] active:scale-[0.99] transition shadow-sm text-lg">
                    報告を送信する
                </button>
            </div>
        </div>

        <!-- Success Screen (Hidden by default) -->
        <div id="success-container" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center space-y-4">
            <div class="inline-flex p-4 rounded-full bg-emerald-50 text-emerald-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-xl font-bold text-slate-900">送信完了しました</h2>
            <p class="text-slate-500 text-sm">残業報告を記録しました。<br>画面を閉じます...</p>
        </div>
    </div>

    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        const LIFF_ID = '__LIFF_ID__'; // Server will inject this
        let userId = '';
        let userName = 'メンバー';

        const loadingDiv = document.getElementById('loading');
        const formContainer = document.getElementById('form-container');
        const successContainer = document.getElementById('success-container');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        // Set default times
        const now = new Date();
        const formatTime = (date) => {
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        };
        
        document.getElementById('start-time').value = "18:00";
        document.getElementById('end-time').value = formatTime(now);

        // Initialize LIFF
        liff.init({ liffId: LIFF_ID })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                const context = liff.getContext();
                if (context && context.userId) {
                    userId = context.userId;
                }

                return liff.getProfile();
            })
            .then((profile) => {
                if (profile) {
                    userName = profile.displayName;
                    if (!userId) userId = profile.userId;
                }
                document.getElementById('user-greeting').innerText = `${userName} さん、お疲れ様でした！`;
                
                loadingDiv.classList.add('hidden');
                formContainer.classList.remove('hidden');
            })
            .catch((err) => {
                console.error('LIFF Initialization failed', err);
                loadingDiv.innerHTML = `
                    <div class="text-rose-500 font-semibold mb-2">初期化エラー</div>
                    <p class="text-slate-500 text-xs">${err.message || err}</p>
                `;
            });

        // Handle Form Submission
        document.getElementById('overtime-form').addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;

            if (!startTime || !endTime) {
                showError('開始時刻と終了時刻を選択してください。');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = '送信中...';
            submitBtn.classList.add('opacity-50');

            fetch('/api/overtime', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    userId,
                    userName,
                    startTime,
                    endTime
                })
            })
            .then(res => {
                if (!res.ok) throw new Error('API送信エラーが発生しました。');
                return res.json();
            })
            .then(data => {
                formContainer.classList.add('hidden');
                successContainer.classList.remove('hidden');
                
                setTimeout(() => {
                    liff.closeWindow();
                }, 1500);
            })
            .catch(err => {
                console.error(err);
                showError(err.message || '送信に失敗しました。時間をおいて再度お試しください。');
                submitBtn.disabled = false;
                submitBtn.innerText = '報告を送信する';
                submitBtn.classList.remove('opacity-50');
            });
        });

        function showError(message) {
            errorMsg.innerText = message;
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
